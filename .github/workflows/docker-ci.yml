
name: Docker CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check JavaScript syntax
        run: node --check postgres-lab/app.js

      - name: Build PostgreSQL app image
        uses: docker/build-push-action@v7
        with:
          context: ./postgres-lab
          push: false
          tags: devops-lab-postgres-app:ci
